# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference

# For a detailed guide to building and testing with Go, read the docs:
# https://circleci.com/docs/language-go/ for more details
version: 2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#jobs-overview & https://circleci.com/docs/reference/configuration-reference/#jobs
jobs:
  build:
    # Specify the execution environment. You can specify an image from Docker Hub or use one of our convenience images from CircleCI's Developer Hub.
    # See: https://circleci.com/docs/guides/execution-managed/executor-intro/ & https://circleci.com/docs/reference/configuration-reference/#executor-job
    docker:
      # Specify the version you desire here
      # See: https://circleci.com/developer/images/image/cimg/go
      - image: cimg/go:1.24

    environment:
      IMAGE_NAME: ulil-albab-be     

    working_directory: ~/ulil-albab

    # Add steps to the job
    # See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#steps-overview & https://circleci.com/docs/reference/configuration-reference/#steps
    steps:
      # Checkout the code as the first step.
      - checkout
      - restore_cache:
          keys:
            - go-mod-v4-{{ checksum "go.sum" }}
      - run:
          name: Install Dependencies
          command: go mod download
      - save_cache:
          key: go-mod-v4-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
      - run:
          name: Get commit SHA from git
          command: |
            echo "export COMMIT_ID=$(git rev-parse --short HEAD)" >> $BASH_ENV
      
      #- run:
      #    name: Run tests
      #    command: |
      #      mkdir -p /tmp/test-reports
      #      gotestsum --junitfile /tmp/test-reports/unit-tests.xml
      #- store_test_results:
      #    path: /tmp/test-reports
      - run:
          name: Setup Env
          command: |
            echo 'export IMAGE_NAME=ulil-albab-be' >> $BASH_ENV
            source $BASH_ENV
            echo $COMMIT_ID
            go build -o ulil-albab-be.app src/project/main.go
      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Build Docker image
          command: |
            docker build --build-arg=SERVICE_NAME=$IMAGE_NAME --platform linux/amd64 -t $DOCKER_USERNAME/$IMAGE_NAME .
            docker tag $DOCKER_USERNAME/$IMAGE_NAME  $DOCKER_USERNAME/$IMAGE_NAME:$COMMIT_ID

      - run:
          name: Push Docker Image
          command: |
            echo "$DOCKER_PWD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker push $DOCKER_USERNAME/$IMAGE_NAME:$COMMIT_ID    

      - add_ssh_keys:
          fingerprints:
            - "SHA256:xbZ+lXdLpdvcoYj8X8X6huA/Z71TBVg+DErTqiooB4w"
      - run:
          name: Debug SSH
          command: |
            ssh -vvv -o StrictHostKeyChecking=no $DO_USER@$DO_IP -p $SSH_PORT "echo 'Testing connection'"
      - run:
          name: Deploy Service
          command: |
            ssh -o StrictHostKeyChecking=no $DO_USER@$DO_IP -p $SSH_PORT
              "cd build && 
              export POSTGRESQL_HOST=$POSTGRESQL_HOST &&
              export IMAGE_TAG=$COMMIT_ID &&
              export IMAGE_NAME=$IMAGE_NAME &&
              ./do_deploy.sh"

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/guides/orchestrate/workflows/ & https://circleci.com/docs/reference/configuration-reference/#workflows
workflows:
  sample: # This is the name of the workflow, feel free to change it to better match your workflow.
    # Inside the workflow, you define the jobs you want to run.
    jobs:
      - build